<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Holyrics Overlay OBS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        padding-bottom: 55px;
        font-family: "Montserrat", sans-serif;
      }

      .banner-container {
        position: relative;
        width: 1180px;
        background: linear-gradient(
          135deg,
          rgba(10, 4, 3, 0.75) 0%,
          rgba(26, 7, 3, 0.7) 50%,
          rgba(12, 3, 2, 0.78) 100%
        );
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-radius: 14px;
        padding: 24px 38px;
        border: 1px solid rgba(255, 80, 25, 0.35);
        box-shadow:
          0 12px 35px rgba(0, 0, 0, 0.7),
          0 0 25px rgba(255, 60, 0, 0.2),
          inset 0 1px 1px rgba(255, 120, 50, 0.35);
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow: hidden;
        opacity: 0;
        transform: translateY(25px);
        transition:
          opacity 0.5s ease,
          transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* Clase activa para mostrar con animación */
      .banner-container.active {
        opacity: 1;
        transform: translateY(0);
      }

      /* Video de fondo integrado */
      .bg-video {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        min-width: 100%;
        min-height: 100%;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
        mix-blend-mode: screen;
        opacity: 0.55;
        z-index: 1;
      }

      .content-wrapper {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .banner-container::before {
        content: "";
        position: absolute;
        top: 0;
        left: 15%;
        right: 15%;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          #ff3b00,
          #ff8c00,
          #ff3b00,
          transparent
        );
        box-shadow: 0 0 10px rgba(255, 65, 0, 0.8);
        z-index: 3;
      }

      .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        padding-bottom: 8px;
      }

      .formal-title {
        font-family: "Cinzel", serif;
        font-weight: 700;
        font-size: 15px;
        color: #ff914d;
        letter-spacing: 3.5px;
        text-transform: uppercase;
        text-shadow: 0 0 8px rgba(255, 100, 30, 0.6);
      }

      .verse-badge {
        display: inline-flex;
        align-items: center;
        padding: 4px 18px;
        border-radius: 50px;
        border: 1.5px solid rgba(255, 255, 255, 0.8);
        background: rgba(0, 0, 0, 0.55);
        color: #ffffff;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        box-shadow: 0 0 10px rgba(255, 60, 0, 0.3);
      }

      .verse-body {
        font-size: 22px;
        line-height: 1.45;
        color: #f2f2f2;
        font-weight: 400;
        letter-spacing: 0.2px;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
      }
    </style>
  </head>
  <body>
    <div class="banner-container" id="banner">
      <video class="bg-video" autoplay muted loop playsinline>
        <source src="fuego.mp4" type="video/mp4" />
      </video>

      <div class="content-wrapper">
        <div class="header-row">
          <span class="formal-title">Santas Escrituras</span>
          <div class="verse-badge" id="verseBadge">Biblia</div>
        </div>
        <p class="verse-body" id="verseText"></p>
      </div>
    </div>

    <script>
      const banner = document.getElementById("banner");
      const verseTextEl = document.getElementById("verseText");
      const verseBadgeEl = document.getElementById("verseBadge");

      let previousRaw = "";

      async function syncHolyrics() {
        try {
          // Consulta directa al endpoint de Holyrics sin iframes bloqueados
          const res = await fetch("http://192.168.57.1/view/text2", {
            cache: "no-store",
          });
          if (!res.ok) return;

          const html = await res.text();
          const doc = new DOMParser().parseFromString(html, "text/html");
          const raw = doc.body.innerText.trim();

          if (raw === previousRaw) return;
          previousRaw = raw;

          if (raw.length > 0) {
            // Extrae el versículo entre paréntesis: "14 (Lucas 19:14)\nTexto..."
            const match = raw.match(/\(([^)]+)\)/);

            if (match) {
              // Asigna la referencia al badge: ej. "LUCAS 19:14"
              verseBadgeEl.textContent = match[1];

              // Limpia la primera línea con número y referencia, dejando solo el texto del versículo
              const lines = raw
                .split("\n")
                .map((l) => l.trim())
                .filter((l) => l.length > 0);
              const bodyLines = lines.filter(
                (l) => !l.includes(match[1]) && !/^\d+\s*\(/.test(l),
              );

              verseTextEl.textContent = `"${bodyLines.join(" ")}"`;
            } else {
              verseBadgeEl.textContent = "Palabra de Dios";
              verseTextEl.textContent = `"${raw}"`;
            }

            banner.classList.add("active");
          } else {
            // Oculta el banner suavemente cuando no hay nada proyectado
            banner.classList.remove("active");
          }
        } catch (err) {
          // En espera de señal de Holyrics
        }
      }

      // Comprueba cambios cada 300 ms
      setInterval(syncHolyrics, 300);
      syncHolyrics();
    </script>
  </body>
</html>
